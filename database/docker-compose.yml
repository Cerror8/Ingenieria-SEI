services:
  db:
    image: postgres:16
    container_name: sei_pmo_db
    environment:
      POSTGRES_DB: sei_pmo
      POSTGRES_USER: sei
      POSTGRES_PASSWORD: sei_dev_password   # cámbiala fuera de desarrollo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # se ejecuta 01..04 solo la primera vez
volumes:
  pgdata:
