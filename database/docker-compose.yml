services:
  db:
    image: postgres:16
    container_name: sei_rap_db
    environment:
      POSTGRES_DB: sei_rap
      POSTGRES_USER: sei
      POSTGRES_PASSWORD: sei_dev_password   # cámbiala fuera de desarrollo
    ports: ["5433:5432"]   # 5433 en el host porque 5432 puede estar ocupado por otro PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # ejecuta 01_schema.sql la primera vez

  adminer:
    image: adminer:4
    container_name: sei_rap_adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports: ["8081:8080"]   # 8080 lo usa kafka-ui
    depends_on:
      - db

volumes:
  pgdata:
